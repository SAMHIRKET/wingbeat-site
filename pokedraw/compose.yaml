name: wingbeat-pokedraw
services:
  pokedraw:
    build: .
    init: true
    restart: unless-stopped
    read_only: true
    environment:
      DATA_DIR: /data
      TRUST_PROXY: "0"
    ports:
      - "${LAN_BIND:-127.0.0.1}:3000:3000"
    volumes:
      - rooms:/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
volumes:
  rooms:
