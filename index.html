  function add(color,x,y,r){if(r<.08)return;let p=paths.get(color);if(!p){p=new Path2D();paths.set(color,p);}dot(p,x,y,Math.min(grid*.46,r));}
  for(let tile=Math.floor((top-220)/tileHeight);tile<=Math.floor((top+H+220)/tileHeight);tile++){
    for(const o of tileObjects(tile)){
      const cx=mod(o.x*W+t*o.vx+140,W+280)-140;
      const cy=tile*tileHeight+mod(o.y*tileHeight+t*o.vy+100,tileHeight+200)-100-top;
      const R=o.r,extent=R*1.8,ca=Math.cos(o.angle),sa=Math.sin(o.angle);
      if(cy+extent<0||cy-extent>H)continue;
      for(let y=Math.max(2.5,Math.floor((cy-extent)/grid)*grid+2.5);y<Math.min(H,cy+extent);y+=grid){
        for(let x=Math.max(2.5,Math.floor((cx-extent)/grid)*grid+2.5);x<Math.min(W,cx+extent);x+=grid){
          const dx=(x-cx)/R,dy=(y-cy)/R,u=dx*ca+dy*sa,v=-dx*sa+dy*ca;
          let nx=0,ny=0,nz=0,inside=false,strength=1;
          if(o.kind===0){const q=u*u+v*v;if(q<1){inside=true;nx=u;ny=v;nz=Math.sqrt(1-q);}}
          if(o.kind===1||o.kind===5){
            const radial=Math.hypot(u,v),tube=o.kind===1?.055:.21,q=(radial-.73)/tube;
            if(Math.abs(q)<1){inside=true;nx=q*u/Math.max(radial,.01);ny=q*v/Math.max(radial,.01);nz=Math.sqrt(1-q*q);strength=o.kind===1?.88:1;}
          }
          if(o.kind===2||o.kind===3){
            const limit=o.kind===2?1.45:1.2,curve=.26*Math.sin(u*2.4),thickness=(o.kind===2?.14:.27)*Math.max(0,1-(u/limit)**2),q=(v-curve)/Math.max(thickness,.001);
            if(Math.abs(u)<limit&&Math.abs(q)<1){inside=true;ny=q;nz=Math.sqrt(1-q*q);nx=-.35*Math.cos(u*2.4)*q;}
          }
          if(o.kind===4){const a=Math.max(Math.abs(u)-.65,0),b=v/.47,q=a*a+b*b;if(q<1){inside=true;nx=Math.sign(u)*a;ny=b;nz=Math.sqrt(1-q);}}
          if(!inside)continue;
          const lit=Math.max(0,-nx*.43-ny*.55+nz*.68),shine=Math.pow(Math.max(0,-nx*.36-ny*.43+nz*.82),24);
          const intensity=(.22+.64*lit+.23*shine)*strength;
          add(shine>.45?'#fafff1':palette[o.col],x,y,grid*.46*Math.sqrt(intensity));
        }
      }
    }
  }
  paths.forEach((p,col)=>paint(ctx,p,col,1));
}
function springStep(now){
  springFrame=0;if(document.hidden||motion.matches)return;
  const dt=Math.min((now-(springLast||now))/1000,.035);springLast=now;
  let active=false;
  windows.forEach((w,i)=>{
    if(w===viewer)return;
    let s=springStates.get(w);if(!s){s={y:0,v:0};springStates.set(w,s);}
    const stiffness=w===hero?95:34+i*7,damping=w===hero?18:7+i*.55;
    s.v+=(-stiffness*s.y-damping*s.v)*dt;s.y+=s.v*dt;
    if(Math.abs(s.y)<.035&&Math.abs(s.v)<.08){s.y=0;s.v=0;}else active=true;
    w.n.style.translate=`0 ${s.y.toFixed(3)}px`;
  });
  if(worldDirty){drawWorld();worldDirty=false;}
  if(active)springFrame=requestAnimationFrame(springStep);else springLast=0;
}
function scrollWorld(){
  if(motion.matches||document.hidden)return;
  const delta=scrollY-lastScroll;lastScroll=scrollY;
  windows.forEach((w,i)=>{if(w===viewer)return;let s=springStates.get(w);if(!s){s={y:0,v:0};springStates.set(w,s);}s.y=Math.max(-110,Math.min(110,s.y-delta*(w===hero?.035:.13+i*.018)));});
  // Rebase before browser height limits, preserving the seeded world coordinate.
  if(scrollY>80000){worldOrigin+=60000;scrollTo(0,scrollY-60000);lastScroll=scrollY;}
  else if(scrollY<4000&&worldOrigin>=60000){worldOrigin-=60000;scrollTo(0,scrollY+60000);lastScroll=scrollY;}
  worldDirty=true;if(!springFrame)springFrame=requestAnimationFrame(springStep);
}
function setScrollMode(){
  const changed=document.body.classList.contains('roaming')===motion.matches;
  document.body.classList.toggle('roaming',!motion.matches);if(changed)requestLayout();
  if(springFrame)cancelAnimationFrame(springFrame);springFrame=0;springLast=0;
  if(motion.matches){windows.forEach(w=>w.n.style.translate='');springStates.clear();worldOrigin=0;scrollTo(0,0);}
  lastScroll=scrollY;
}
addEventListener('scroll',scrollWorld,{passive:true});

function layout(){
  sizeWorld();
  if(document.hidden)return;
  windows.forEach(w=>{w.w=w.n.offsetWidth;w.h=w.n.offsetHeight;const p=fitCanvas(w.canvas,w.w+28,w.h+28);p.translate(14,14);});
  letters.forEach(l=>fitCanvas(l.canvas,l.n.clientWidth,l.n.clientHeight));fitCanvas(heroCanvas,hero.w,hero.h);
  windows.forEach(renderWindow);drawButton();drawLetters();drawHerew();updateTele();drawWorld();
}
function requestLayout(){if(resizing)return;resizing=true;requestAnimationFrame(()=>{resizing=false;layout();});}
function tick(){if(document.hidden)return;const now=performance.now();if(!motion.matches)clock+=Math.min((now-last)/1000,.25);last=now;fillSeed=motion.matches?0:Math.floor(clock*6)%3;inkSeed=motion.matches?0:Math.floor(clock*3)%3;windows.forEach(w=>{const r=w.n.getBoundingClientRect();if(r.bottom> -30&&r.top<innerHeight+30)renderWindow(w);});drawButton();drawLetters();updateTele();pauseMedia();drawWorld();}
function run(){setScrollMode();clearInterval(timer);timer=null;last=performance.now();if(document.hidden){pauseMedia();return;}if(motion.matches){windows.forEach(w=>w.n.classList.add("open","ready"));fillSeed=inkSeed=0;layout();pauseMedia();}else{timer=setInterval(tick,1000/6);tick();pauseMedia();}}
["pointerenter","pointerleave","focus","blur"].forEach(type=>play.addEventListener(type,drawButton));
addEventListener("resize",requestLayout,{passive:true});document.addEventListener("visibilitychange",()=>{if(!document.hidden)layout();run();});motion.addEventListener("change",run);
applyColors();
fonts().then(a=>{atlases=a;}).catch(()=>{/* Real DOM text remains available if a font file fails. */}).finally(()=>{ready=true;layout();run();});
})();
</script>
